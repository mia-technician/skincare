<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referral Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f1f5f9; font-family: 'Inter', sans-serif; color: #333; padding: 20px; }
  
  .dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; max-width: 1100px; margin-left: auto; margin-right: auto;}
  .stat-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .stat-card h3 { font-size: 0.8rem; color: #64748b; margin-bottom: 8px; }
  .stat-card .value { font-size: 1.5rem; font-weight: 700; }
  .value.pending { color: #dc2626; }
  .value.used { color: #64748b; font-style: italic; }
  .value.blue { color: #3b82f6; }

  .workspace { max-width: 1100px; margin: 0 auto; }
  .tree-area { display: flex; flex-direction: column; gap: 20px; }
  
  .top-add-bar { text-align: center; margin-bottom: 4px; }
  .btn-add-l1 { padding: 12px 28px; background: #3b82f6; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(59,130,246,0.3); transition: 0.2s; }
  .btn-add-l1:hover { background: #2563eb; transform: translateY(-1px); }

  .node-box { background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px; border-left: 4px solid #3b82f6; }
  .node-box.depth-1 { border-left-color: #3b82f6; background: #fff; }
  .node-box.depth-2 { border-left-color: #10b981; background: #f8fafc; margin-left: 20px; }
  .node-box.depth-3 { border-left-color: #f59e0b; background: #fffbeb; margin-left: 20px; }
  .node-box.depth-4 { border-left-color: #8b5cf6; background: #faf5ff; margin-left: 20px; }
  .node-box.depth-5 { border-left-color: #ec4899; background: #fdf2f8; margin-left: 20px; }

  .node-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 6px;}
  .node-title { font-weight: 700; font-size: 0.95rem; color: #0f172a; }
  .node-controls { display: flex; gap: 4px; flex-wrap: wrap; align-items: center;}

  .card-details { font-size: 0.8rem; color: #64748b; margin-top: 4px; display: flex; gap: 15px; flex-wrap: wrap;}
  
  .edit-icon { font-size: 0.8rem; cursor: pointer; color: #94a3b8; padding: 2px 4px; border-radius: 4px; transition: 0.2s; }
  .edit-icon:hover { background: #f1f5f9; color: #0f172a; }

  .btn { padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem;}
  .btn:hover { background: #2563eb; }
  .btn-danger { background: #ef4444; padding: 4px 8px; font-size: 0.75rem;}
  .btn-move { background: #f1f5f9; color: #475569; padding: 4px 8px; font-size: 0.75rem; border: 1px solid #cbd5e1;}
  .btn-revoke { background: #fff1f2; color: #e11d48; padding: 4px 8px; font-size: 0.75rem; border: 1px solid #fecdd3;}
  .btn-add-child { background: #ecfdf5; color: #059669; padding: 4px 8px; font-size: 0.75rem; border: 1px solid #a7f3d0; }
  .btn-move-node { background: #eef2ff; color: #4f46e5; padding: 4px 8px; font-size: 0.75rem; border: 1px solid #c7d2fe; }

  .status-pending { font-weight: 700; color: #dc2626; }
  .status-used { font-style: italic; color: #94a3b8; text-decoration: line-through; } 
  .status-blue { font-weight: 400; color: #2563eb; }
  .status-gray { color: #cbd5e1; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;}
  .modal-overlay.show { display: flex; }
  .modal-content { background: #fff; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;}
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #475569; margin-bottom: 4px; }
  .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .move-list { max-height: 400px; overflow-y: auto; }
  .move-item { padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px; cursor: pointer; transition: 0.15s; display: flex; justify-content: space-between; align-items: center;}
  .move-item:hover { background: #eff6ff; border-color: #3b82f6; }
  .move-item-depth { font-size: 0.7rem; color: #94a3b8; }

  .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); display: none; justify-content: center; align-items: center; z-index: 2000; font-weight: bold; color: #3b82f6;}
  .loading-overlay.show { display: flex; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; color: white; padding: 12px 24px; border-radius: 8px; font-size: 0.9rem; opacity: 0; transform: translateY(20px); transition: 0.3s; z-index: 3000; pointer-events: none;}
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: #dc2626; }
</style>
</head>
<body>

<div class="loading-overlay" id="loading">同步云端数据中...</div>
<div class="toast" id="toast">保存成功</div>

<div class="dashboard">
  <div class="stat-card"><h3>⏳ 待使用 (Pending)</h3><div class="value pending" id="total-pending">$0</div></div>
  <div class="stat-card"><h3>✅ 已使用 (Used)</h3><div class="value used" id="total-used">$0</div></div>
  <div class="stat-card"><h3>❌ 已过期 (Expired)</h3><div class="value blue" id="total-expired">$0</div></div>
  <div class="stat-card"><h3>👥 已整理人数</h3><div class="value" id="total-people">0</div></div>
</div>

<div class="workspace">
  <div class="tree-area">
    <div class="top-add-bar">
      <button class="btn-add-l1" onclick="openAddModal(null)">➕ 添加第一级客户</button>
    </div>
    <div id="tree-container"></div>
  </div>
</div>

<!-- 新增/编辑弹窗 -->
<div class="modal-overlay" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle" style="margin-bottom: 16px; font-size: 1.1rem;">新增卡片</h3>
    <form id="editForm" onsubmit="saveData(event)">
      <input type="hidden" id="editPersonId">
      <input type="hidden" id="editParentId">
      
      <div class="form-group">
        <label for="inputNodeName">姓名 *</label>
        <input type="text" id="inputNodeName" required placeholder="如: Ti Pu">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputNodeId">编号 ID</label>
          <input type="text" id="inputNodeId" placeholder="如: 38870">
        </div>
        <div class="form-group">
          <label for="inputNote">备注</label>
          <input type="text" id="inputNote" placeholder="如: TMG 5/8">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputRefCredit">介绍费 ($)</label>
          <input type="number" step="0.01" id="inputRefCredit" value="0">
        </div>
        <div class="form-group">
          <label for="inputRefStatus">介绍费状态</label>
          <select id="inputRefStatus">
            <option value="pending">待使用 (红)</option>
            <option value="used">已使用 (灰划线)</option>
            <option value="blue">已过期 (蓝)</option>
            <option value="gray">待定 (浅灰)</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="inputRefereeCredit">新人费 ($)</label>
          <input type="number" step="0.01" id="inputRefereeCredit" value="0">
        </div>
        <div class="form-group">
          <label for="inputRefereeStatus">新人费状态</label>
          <select id="inputRefereeStatus">
            <option value="pending">待使用 (红)</option>
            <option value="used">已使用 (灰划线)</option>
            <option value="blue">已过期 (蓝)</option>
            <option value="gray">待定 (浅灰)</option>
          </select>
        </div>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:20px;">
        <button type="button" class="btn" style="background:#e2e8f0; color:#333;" onclick="closeModal()">取消</button>
        <button type="submit" class="btn">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 移动目标选择弹窗 -->
<div class="modal-overlay" id="moveModal">
  <div class="modal-content">
    <h3 style="margin-bottom: 8px; font-size: 1.1rem;">移动到...</h3>
    <p style="font-size: 0.8rem; color:#64748b; margin-bottom: 16px;">选择新的上级，或选择"移到顶级"。</p>
    <div class="move-list" id="moveList"></div>
    <div style="display:flex; justify-content:flex-end; margin-top:16px;">
      <button type="button" class="btn" style="background:#e2e8f0; color:#333;" onclick="closeMoveModal()">取消</button>
    </div>
  </div>
</div>

<script>
  // ========== 极简 Supabase REST 客户端（不用 supabase-js） ==========
  const SUPABASE_URL = "https://dmrskyskryrdclknezth.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtcnNreXNrcnlyZGNsa25lenRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNzE2MzgsImV4cCI6MjA4OTk0NzYzOH0.Dnced4YAY24fE6kLxOe9YuR6Wrgt8pYcqKcjMFWDrY8";

  const api = {
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json'
    },

    // 通用请求
    async request(path, options = {}) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...options,
        headers: { ...this.headers, ...(options.headers || {}) }
      });
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text}`);
      }
      // 有些请求（如 DELETE）可能返回空 body
      const text = await res.text();
      return text ? JSON.parse(text) : null;
    },

    // 查询：table, 查询字符串（如 'order=created_at.asc'）
    async select(table, query = '') {
      return this.request(`${table}${query ? '?' + query : ''}`);
    },

    // 插入：返回插入的行
    async insert(table, row) {
      return this.request(table, {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify(row)
      });
    },

    // 更新：filter 如 'id=eq.xxx'
    async update(table, filter, patch) {
      return this.request(`${table}?${filter}`, {
        method: 'PATCH',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify(patch)
      });
    },

    // 删除：filter 如 'id=eq.xxx'
    async delete(table, filter) {
      return this.request(`${table}?${filter}`, { method: 'DELETE' });
    }
  };

  // ========== 状态 ==========
  let allPeople = [];
  let allRelations = [];
  let tree = [];
  let movingPersonId = null;

  function showToast(msg, isError = false) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => { toast.className = 'toast'; }, 3000);
  }

  // ========== 加载 ==========
  async function fetchDataFromCloud() {
    showLoading(true);
    try {
      const [people, relations] = await Promise.all([
        api.select('people', 'order=created_at.asc'),
        api.select('referrals', 'order=sort_order.asc')
      ]);
      allPeople = people || [];
      allRelations = relations || [];
      render();
    } catch (err) {
      showToast("拉取失败: " + err.message, true);
    } finally {
      showLoading(false);
    }
  }

  // ========== 建树 ==========
  function buildTree() {
    const personMap = {};
    allPeople.forEach(p => {
      personMap[p.id] = { ...p, children: [], relationFromParent: null, parentId: null };
    });

    allRelations.forEach(r => {
      if (personMap[r.referee_id] && personMap[r.referrer_id]) {
        personMap[r.referee_id].relationFromParent = r;
        personMap[r.referee_id].parentId = r.referrer_id;
      }
    });

    const roots = [];
    allPeople.forEach(p => {
      const node = personMap[p.id];
      if (node.parentId) {
        if (personMap[node.parentId]) {
          personMap[node.parentId].children.push(node);
        }
      } else {
        roots.push(node);
      }
    });

    // 根节点：按 created_at 排序（保持稳定）
    roots.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));

    tree = roots;
  }

  // ========== 渲染 ==========
  function render() {
    buildTree();
    const container = document.getElementById('tree-container');
    container.innerHTML = '';

    if (tree.length === 0) {
      container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:40px;">还没有任何客户，点击上方按钮添加第一级客户</div>';
      calculateStats();
      return;
    }

    tree.forEach(root => {
      container.appendChild(renderNode(root, 1));
    });

    calculateStats();
  }

  function renderNode(node, depth) {
    const wrap = document.createElement('div');

    const box = document.createElement('div');
    box.className = 'node-box depth-' + Math.min(depth, 5);

    const rel = node.relationFromParent;
    const refCredit = rel ? Number(rel.referrer_credit || 0) : 0;
    const refStatus = rel ? (rel.referrer_status || 'gray') : 'gray';
    const reeCredit = rel ? Number(rel.referee_credit || 0) : 0;
    const reeStatus = rel ? (rel.referee_status || 'gray') : 'gray';

    const pClass = statusClass(refStatus);
    const rClass = statusClass(reeStatus);
    const depthLabel = depth === 1 ? '一级' : (depth === 2 ? '二级' : (depth === 3 ? '三级' : depth + '级'));

    box.innerHTML = `
      <div class="node-header">
        <span class="node-title">${depthLabel} · ${escapeHtml(node.name)} ${node.ref_id ? '<span style="color:#94a3b8; font-weight:400;">#'+escapeHtml(node.ref_id)+'</span>' : ''}</span>
        <div class="node-controls">
          ${node.parentId ? `
            <button class="btn btn-move" onclick="moveSibling('${node.id}', -1)" title="上移">↑</button>
            <button class="btn btn-move" onclick="moveSibling('${node.id}', 1)" title="下移">↓</button>
          ` : ''}
          <button class="btn btn-add-child" onclick="openAddModal('${node.id}')">➕ 加下级</button>
          <button class="btn btn-move-node" onclick="openMoveModal('${node.id}')">🔀 移动</button>
          <button class="btn btn-revoke" onclick="revokeNode('${node.id}')" title="退回顶级">↩️ 退回</button>
          <span class="edit-icon" onclick="openEditModal('${node.id}')">✏️</span>
        </div>
      </div>
      <div class="card-details">
        <span>介绍费: <strong class="${pClass}">$${refCredit}</strong></span>
        <span>新人费: <strong class="${rClass}">$${reeCredit}</strong></span>
        ${node.note ? `<span style="color:#94a3b8;">📝 ${escapeHtml(node.note)}</span>` : ''}
      </div>
    `;
    wrap.appendChild(box);

    if (node.children && node.children.length > 0) {
      const sorted = [...node.children].sort((a, b) => {
        const sa = Number(a.relationFromParent?.sort_order ?? 0);
        const sb = Number(b.relationFromParent?.sort_order ?? 0);
        return sa - sb;
      });
      sorted.forEach(child => {
        wrap.appendChild(renderNode(child, depth + 1));
      });
    }

    return wrap;
  }

  function statusClass(s) {
    if (s === 'pending') return 'status-pending';
    if (s === 'used') return 'status-used';
    if (s === 'blue') return 'status-blue';
    return 'status-gray';
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  // ========== 新增/编辑 ==========
  function openAddModal(parentPersonId) {
    document.getElementById('modalTitle').innerText = parentPersonId ? '新增下级客户' : '新增第一级客户';
    document.getElementById('editForm').reset();
    document.getElementById('editPersonId').value = '';
    document.getElementById('editParentId').value = parentPersonId || '';
    document.getElementById('modal').classList.add('show');
  }

  function openEditModal(personId) {
    const person = allPeople.find(p => p.id === personId);
    if (!person) return;
    const rel = allRelations.find(r => r.referee_id === personId);

    document.getElementById('modalTitle').innerText = '编辑卡片: ' + person.name;
    document.getElementById('editForm').reset();
    document.getElementById('editPersonId').value = person.id;
    document.getElementById('editParentId').value = rel ? rel.referrer_id : '';

    document.getElementById('inputNodeName').value = person.name || '';
    document.getElementById('inputNodeId').value = person.ref_id || '';
    document.getElementById('inputNote').value = person.note || '';
    document.getElementById('inputRefCredit').value = rel ? Number(rel.referrer_credit || 0) : 0;
    document.getElementById('inputRefStatus').value = rel ? (rel.referrer_status || 'gray') : 'gray';
    document.getElementById('inputRefereeCredit').value = rel ? Number(rel.referee_credit || 0) : 0;
    document.getElementById('inputRefereeStatus').value = rel ? (rel.referee_status || 'gray') : 'gray';

    document.getElementById('modal').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('show');
  }

  async function saveData(e) {
    e.preventDefault();
    const personId = document.getElementById('editPersonId').value;
    const parentId = document.getElementById('editParentId').value || null;
    const name = document.getElementById('inputNodeName').value.trim();
    const refId = document.getElementById('inputNodeId').value.trim() || null;
    const note = document.getElementById('inputNote').value.trim() || null;
    const refCredit = Number(document.getElementById('inputRefCredit').value) || 0;
    const refStatus = document.getElementById('inputRefStatus').value;
    const reeCredit = Number(document.getElementById('inputRefereeCredit').value) || 0;
    const reeStatus = document.getElementById('inputRefereeStatus').value;

    if (!name) { alert("请填写名字！"); return; }

    try {
      if (personId) {
        // 编辑
        await api.update('people', `id=eq.${personId}`, {
          name, ref_id: refId, note
        });

        const rel = allRelations.find(r => r.referee_id === personId);
        if (rel) {
          await api.update('referrals', `id=eq.${rel.id}`, {
            referrer_credit: refCredit,
            referrer_status: refStatus,
            referee_credit: reeCredit,
            referee_status: reeStatus
          });
        }

        closeModal();
        showToast("保存成功");
        fetchDataFromCloud();
      } else {
        // 新增
        const [newPerson] = await api.insert('people', { name, ref_id: refId, note });
        if (!newPerson || !newPerson.id) throw new Error("插入 people 后未返回 id");

        if (parentId) {
          const siblings = allRelations.filter(r => r.referrer_id === parentId);
          const maxOrder = siblings.reduce((m, r) => Math.max(m, Number(r.sort_order ?? 0)), 0);

          await api.insert('referrals', {
            referrer_id: parentId,
            referee_id: newPerson.id,
            referrer_credit: refCredit,
            referrer_status: refStatus,
            referee_credit: reeCredit,
            referee_status: reeStatus,
            sort_order: maxOrder + 1
          });
        }

        closeModal();
        showToast("新增成功");
        fetchDataFromCloud();
      }
    } catch (err) {
      showToast("保存失败: " + err.message, true);
    }
  }

  // ========== 退回 ==========
  async function revokeNode(personId) {
    const rel = allRelations.find(r => r.referee_id === personId);
    if (!rel) { showToast("此人已经是顶级", true); return; }
    if (!confirm("把这个人退回到顶级？他的下级会继续挂在他下面。")) return;

    try {
      await api.delete('referrals', `id=eq.${rel.id}`);
      showToast("已退回顶级");
      fetchDataFromCloud();
    } catch (err) {
      showToast("退回失败: " + err.message, true);
    }
  }

  // ========== 移动 ==========
  function openMoveModal(personId) {
    movingPersonId = personId;
    const person = allPeople.find(p => p.id === personId);
    if (!person) return;

    const descendants = new Set();
    function collectDescendants(pid) {
      allRelations.filter(r => r.referrer_id === pid).forEach(r => {
        descendants.add(r.referee_id);
        collectDescendants(r.referee_id);
      });
    }
    collectDescendants(personId);

    const list = document.getElementById('moveList');
    list.innerHTML = '';

    const topItem = document.createElement('div');
    topItem.className = 'move-item';
    topItem.innerHTML = `<span>⬆️ 移到顶级（成为一级）</span>`;
    topItem.onclick = () => doMove(null);
    list.appendChild(topItem);

    const currentRel = allRelations.find(r => r.referee_id === personId);
    const currentParentId = currentRel ? currentRel.referrer_id : null;

    const flat = [];
    function flatten(node, depth) {
      flat.push({ node, depth });
      (node.children || []).forEach(c => flatten(c, depth + 1));
    }
    tree.forEach(r => flatten(r, 1));

    flat.forEach(({ node, depth }) => {
      if (node.id === personId) return;
      if (descendants.has(node.id)) return;
      if (node.id === currentParentId) return;

      const item = document.createElement('div');
      item.className = 'move-item';
      item.innerHTML = `
        <span>${escapeHtml(node.name)} ${node.ref_id ? '<span style="color:#94a3b8;">#'+escapeHtml(node.ref_id)+'</span>' : ''}</span>
        <span class="move-item-depth">${depth}级</span>
      `;
      item.onclick = () => doMove(node.id);
      list.appendChild(item);
    });

    document.getElementById('moveModal').classList.add('show');
  }

  function closeMoveModal() {
    document.getElementById('moveModal').classList.remove('show');
    movingPersonId = null;
  }

  async function doMove(newParentId) {
    const personId = movingPersonId;
    if (!personId) return;

    const rel = allRelations.find(r => r.referee_id === personId);

    try {
      if (newParentId === null) {
        if (rel) {
          await api.delete('referrals', `id=eq.${rel.id}`);
        }
      } else {
        const siblings = allRelations.filter(r => r.referrer_id === newParentId);
        const maxOrder = siblings.reduce((m, r) => Math.max(m, Number(r.sort_order ?? 0)), 0);

        if (rel) {
          await api.update('referrals', `id=eq.${rel.id}`, {
            referrer_id: newParentId,
            sort_order: maxOrder + 1
          });
        } else {
          await api.insert('referrals', {
            referrer_id: newParentId,
            referee_id: personId,
            referrer_credit: 0, referrer_status: 'gray',
            referee_credit: 0, referee_status: 'gray',
            sort_order: maxOrder + 1
          });
        }
      }

      closeMoveModal();
      showToast("移动成功");
      fetchDataFromCloud();
    } catch (err) {
      showToast("移动失败: " + err.message, true);
    }
  }

  // ========== 同级排序 ==========
  async function moveSibling(personId, direction) {
    const myRel = allRelations.find(r => r.referee_id === personId);
    if (!myRel) return;

    const siblings = allRelations
      .filter(r => r.referrer_id === myRel.referrer_id)
      .sort((a, b) => Number(a.sort_order ?? 0) - Number(b.sort_order ?? 0));

    const idx = siblings.findIndex(r => r.id === myRel.id);
    const targetIdx = idx + direction;
    if (targetIdx < 0 || targetIdx >= siblings.length) return;

    const target = siblings[targetIdx];
    const myOrder = Number(myRel.sort_order ?? 0);
    const targetOrder = Number(target.sort_order ?? 0);

    try {
      if (myOrder === targetOrder) {
        await api.update('referrals', `id=eq.${myRel.id}`, { sort_order: targetOrder + direction * 0.5 });
      } else {
        await api.update('referrals', `id=eq.${myRel.id}`, { sort_order: targetOrder });
        await api.update('referrals', `id=eq.${target.id}`, { sort_order: myOrder });
      }
      showToast("顺序已保存");
      fetchDataFromCloud();
    } catch (err) {
      showToast("排序保存失败: " + err.message, true);
    }
  }

  // ========== 统计 ==========
  function calculateStats() {
    let pending = 0, used = 0, expired = 0;

    allRelations.forEach(r => {
      const rc = Number(r.referrer_credit || 0);
      const ec = Number(r.referee_credit || 0);
      if (r.referrer_status === 'pending') pending += rc;
      else if (r.referrer_status === 'used') used += rc;
      else if (r.referrer_status === 'blue') expired += rc;

      if (r.referee_status === 'pending') pending += ec;
      else if (r.referee_status === 'used') used += ec;
      else if (r.referee_status === 'blue') expired += ec;
    });

    document.getElementById('total-pending').innerText = '$' + pending;
    document.getElementById('total-used').innerText = '$' + used;
    document.getElementById('total-expired').innerText = '$' + expired;
    document.getElementById('total-people').innerText = allPeople.length;
  }

  function showLoading(show) {
    if (show) document.getElementById('loading').classList.add('show');
    else document.getElementById('loading').classList.remove('show');
  }

  fetchDataFromCloud();
</script>
</body>
